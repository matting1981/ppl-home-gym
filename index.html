<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>PPL Home Gym</title><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--line:#e5e7eb;--good:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:3}h1{margin:0;font-size:25px}.sub{color:#cbd5e1;font-size:13px;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:14px 14px 80px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tabs button,.day{border:0;border-radius:12px;padding:12px 8px;background:#e5e7eb;font-weight:700;color:#374151}.tabs button.active{background:var(--accent);color:white}.day{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);margin:7px 0;padding:14px}.day strong{display:block}.day small{color:var(--muted)}.workout{display:none}.workout.active{display:block}.back{border:0;background:none;padding:4px 0 12px;color:var(--accent);font-weight:700}.exercise{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.exhead{display:flex;justify-content:space-between;gap:10px}.exname{font-weight:750}.target{color:var(--muted);font-size:13px;margin-top:3px}.sets{margin-top:10px;display:grid;grid-template-columns:34px 1fr 1fr 42px;gap:7px;align-items:center;font-size:12px;color:var(--muted)}.sets input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px}.sets input:focus{outline:2px solid #bfdbfe;border-color:var(--accent)}.done{width:32px;height:32px;border-radius:8px;border:1px solid #d1d5db;background:white}.done.checked{background:var(--good);color:white;border-color:var(--good)}.timer{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111827;color:white;border-radius:999px;padding:10px 16px;display:none;box-shadow:0 5px 25px #0003;z-index:5}.timer button{border:0;border-radius:20px;padding:6px 10px;margin-left:8px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.reset{border:0;background:#fee2e2;color:#991b1b;border-radius:9px;padding:8px;font-size:12px}.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px;font-size:13px;color:#1e3a8a;margin:10px 0 15px}.finish{width:100%;border:0;background:#111827;color:white;border-radius:12px;padding:14px;font-size:16px;font-weight:750;margin-top:10px}.hidden{display:none}.homebtn{border:0;background:#334155;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px}
</style></head><body><header><div class="topbar"><div><h1>PPL Home Gym</h1><div class="sub">Push • Pull • Legs · 60–75 min</div></div><button class="homebtn" id="install" hidden>Install</button></div></header><main class="wrap"><div id="chooser"><div class="tabs"><button class="active" data-cat="push">Push</button><button data-cat="pull">Pull</button><button data-cat="legs">Legs</button></div><div id="days"></div></div><section id="session" class="workout"><button class="back" id="back">← All workouts</button><div id="sessionContent"></div></section></main><div class="timer" id="timer"><span id="timerText">2:00</span><button id="timerStop">Stop</button></div><script>
const workouts={push:[{id:'pushA',name:'Push A',desc:'Chest, shoulders & triceps',ex:[['Barbell bench press','4 × 5–8'],['Incline dumbbell press','3 × 8–12'],['Dumbbell shoulder press','3 × 8–12'],['Cable lateral raises','3 × 12–15'],['Cable triceps pushdowns','3 × 10–15'],['Dips','2–3 × 8–15']]},{id:'pushB',name:'Push B',desc:'Chest, shoulders & triceps',ex:[['Incline barbell bench press','4 × 6–10'],['Dumbbell flat bench press','3 × 8–12'],['Landmine press','3 × 8–12 each side'],['Cable/dumbbell lateral raises','3 × 12–20'],['Overhead cable triceps extension','3 × 10–15'],['Dips','3 × 8–15']]}],pull:[{id:'pullA',name:'Pull A',desc:'Back, rear delts & biceps',ex:[['Pull-ups','4 × 5–10'],['Barbell bent-over row','3 × 6–10'],['Lat pulldown','3 × 8–12'],['Seated cable row','3 × 8–12'],['Cable face pulls','3 × 12–15'],['Dumbbell curls','3 × 8–12'],['Hammer curls','2 × 10–15']]},{id:'pullB',name:'Pull B',desc:'Back, rear delts & biceps',ex:[['Weighted pull-ups','4 × 5–8'],['Landmine rows','3 × 8–12'],['Single-arm cable row','3 × 8–12 each side'],['Lat pulldown','3 × 10–12'],['Cable rear-delt fly/face pull','3 × 12–20'],['Barbell curls','3 × 8–12'],['Incline dumbbell curls','2 × 10–15']]}],legs:[{id:'legsA',name:'Legs A',desc:'Quads & hamstrings',ex:[['Barbell back squat','4 × 5–8'],['Romanian deadlift','3 × 6–10'],['Bulgarian split squat','3 × 8–12 each leg'],['Dumbbell walking lunges','2 × 10–15 each leg'],['Standing calf raises','4 × 10–15'],['Hanging leg raises','3 × 8–15']]},{id:'legsB',name:'Legs B',desc:'Quads, glutes & hamstrings',ex:[['Barbell front squat','4 × 6–10'],['Barbell hip thrust','3 × 8–12'],['Romanian deadlift','3 × 8–12'],['Reverse lunges','3 × 8–12 each leg'],['Dumbbell goblet squat','2 × 12–15'],['Standing calf raises','4 × 12–20'],['Hanging knee/leg raises','3 × 10–15']]}]};
let cat='push',current=null,timer=null,remaining=120;const $=s=>document.querySelector(s);const days=$('#days');
function renderDays(){days.innerHTML=workouts[cat].map(w=>`<button class="day" data-id="${w.id}"><strong>${w.name}</strong><small>${w.desc} · ${w.ex.length} exercises</small></button>`).join('')}
function openWorkout(id){current=workouts[cat].find(w=>w.id===id);$('#chooser').style.display='none';$('#session').classList.add('active');let key='ppl-'+id;let saved=JSON.parse(localStorage.getItem(key)||'{}');$('#sessionContent').innerHTML=`<div class="topbar"><div><h2 style="margin:0">${current.name}</h2><div class="target">${current.desc}</div></div><button class="reset" id="reset">Reset</button></div><div class="note">For most sets, leave 1–3 good reps in reserve. Rest 2–3 min on big lifts and 60–90 sec on isolation work. Tap ✓ when a set is complete.</div>${current.ex.map((e,i)=>{let n=parseInt((e[1].match(/^(\d+)/)||['1','1'])[1]);return `<div class="exercise"><div class="exhead"><div><div class="exname">${i+1}. ${e[0]}</div><div class="target">${e[1]}</div></div><button class="reset" onclick="startTimer()">Rest</button></div><div class="sets"><span>Set</span><span>Weight</span><span>Reps</span><span>✓</span>${Array.from({length:n},(_,s)=>`<span>${s+1}</span><input inputmode="decimal" placeholder="kg" data-k="${i}-${s}-w" value="${saved[`${i}-${s}-w`]||''}"><input inputmode="numeric" placeholder="reps" data-k="${i}-${s}-r" value="${saved[`${i}-${s}-r`]||''}"><button class="done ${saved[`${i}-${s}-d`]?'checked':''}" data-k="${i}-${s}-d">✓</button>`).join('')}</div></div>`}).join('')}<button class="finish" id="finish">Finish workout</button>`;document.querySelectorAll('#sessionContent input').forEach(x=>x.oninput=save);document.querySelectorAll('.done').forEach(x=>x.onclick=()=>{x.classList.toggle('checked');save();if(x.classList.contains('checked')) startTimer()});$('#reset').onclick=()=>{if(confirm('Reset this workout log?')){localStorage.removeItem(key);openWorkout(id)}};$('#finish').onclick=()=>{localStorage.setItem('lastWorkout',new Date().toISOString());alert('Workout complete! Great work.')}}
function save(){let o={};document.querySelectorAll('#sessionContent input').forEach(x=>o[x.dataset.k]=x.value);document.querySelectorAll('.done').forEach(x=>o[x.dataset.k]=x.classList.contains('checked'));localStorage.setItem('ppl-'+current.id,JSON.stringify(o))}
function startTimer(){remaining=120;$('#timer').style.display='block';clearInterval(timer);tick();timer=setInterval(tick,1000)}function tick(){let m=Math.floor(remaining/60),s=remaining%60;$('#timerText').textContent=`${m}:${String(s).padStart(2,'0')}`;if(remaining<=0){clearInterval(timer);navigator.vibrate?.([250,100,250])}else remaining--}$('#timerStop').onclick=()=>{clearInterval(timer);$('#timer').style.display='none'};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;renderDays()});days.onclick=e=>{let b=e.target.closest('.day');if(b)openWorkout(b.dataset.id)};$('#back').onclick=()=>{$('#session').classList.remove('active');$('#chooser').style.display='block';clearInterval(timer);$('#timer').style.display='none'};renderDays();
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('#install').hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
